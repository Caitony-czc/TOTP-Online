<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- 纯色圆角底板，填满整个 256x256，除了圆角外部全是透明，无任何阴影 -->
  <rect width="256" height="256" rx="56" fill="#F6F6F4" />
  
  <!-- 内部的时钟/安全环 -->
  <circle cx="128" cy="105" r="50" fill="none" stroke="#E4E4E0" stroke-width="12"/>
  <path d="M128 55 A50 50 0 0 1 178 105" fill="none" stroke="#C94B1F" stroke-width="12" stroke-linecap="round"/>
  
  <!-- 内部的安全盾牌 -->
  <path d="M128 75 L105 87 V 115 C 105 135 118 150 128 157 C 138 150 151 135 151 115 V 87 Z" fill="#111111"/>
  
  <!-- 盾牌内的对勾 -->
  <path d="M118 120 L125 127 L140 105" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 底部 TOTP 文本 -->
  <text x="128" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="900" fill="#111111" text-anchor="middle" letter-spacing="2">TOTP</text>
</svg>
