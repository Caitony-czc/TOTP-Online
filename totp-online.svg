<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="256" height="256">
  <defs>
    <linearGradient id="bg-grad-totp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fa709a" />
      <stop offset="100%" stop-color="#fee140" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="24" fill="url(#bg-grad-totp)" />

  <!-- Abstract digital wave/dots in background for 'Online' tech feel -->
  <g fill="#ffffff" fill-opacity="0.2">
    <circle cx="20" cy="20" r="3" />
    <circle cx="35" cy="20" r="3" />
    <circle cx="50" cy="20" r="3" />
    <circle cx="65" cy="20" r="3" />
    <circle cx="80" cy="20" r="3" />
    
    <circle cx="20" cy="80" r="3" />
    <circle cx="35" cy="80" r="3" />
    <circle cx="50" cy="80" r="3" />
    <circle cx="65" cy="80" r="3" />
    <circle cx="80" cy="80" r="3" />
  </g>

  <!-- Circular progress track (like TOTP 30-second timer) -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25" />
  <path d="M 50 20 A 30 30 0 0 1 80 50" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" filter="url(#shadow)" />

  <!-- Lock Icon in the center (FontAwesome solid lock) -->
  <g transform="translate(35.5, 33.4) scale(0.065)" fill="#ffffff" filter="url(#shadow)">
    <path d="M400 224h-24v-72C376 68.2 307.8 0 224 0S72 68.2 72 152v72H48c-26.5 0-48 21.5-48 48v192c0 26.5 21.5 48 48 48h352c26.5 0 48-21.5 48-48V272c0-26.5-21.5-48-48-48zm-104 0H152v-72c0-39.7 32.3-72 72-72s72 32.3 72 72v72z"/>
  </g>
</svg>
